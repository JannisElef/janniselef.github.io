
# Hierarchical tag definitions for projects
# family > tag: description

status:
  label: Status
  tags:
    Active:      "Project is actively being worked on"
    Semi-Active: "Project will be picked up again someday"
    Finished:    "Project is complete"

type:
  label: Type
  tags:
    Test: "Experimental project"
    Game:    "Playable game"
    Website: "A standalone website"

category:
  label: Category
  tags:
    3D-Print:    "3D printing project"
    Electronics: "Electronics / hardware project"
    Software:
      description: "Software project"
      children:
        C:      "Written in C"
        Python: "Written in Python"
