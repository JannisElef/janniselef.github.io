
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">

<style>
    #readme-container h2 {
        font-size: 2rem;
    }

    #readme-container h1,
    #readme-container h2,
    #readme-container h3,
    #readme-container h4 {
        scroll-margin-top: 100px;
    }

    #readme-container table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 16px;
    }

    #readme-container th,
    #readme-container td {
        padding: 8px 13px;
        border: 1px solid var(--border-color);
    }

    #readme-container th {
        background-color: rgba(128, 128, 128, 0.05);
    }

    #readme-container tr:nth-child(2n) {
        background-color: rgba(128, 128, 128, 0.03);
    }

    #readme-container pre {
        margin: 16px 0;
        padding: 16px;
        border-radius: 8px;
        overflow: auto;
        border: 1px solid var(--border-color);
    }
</style>

<div id="readme-container">Loading README.md...</div>

<!-- <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> -->
<script src="/assets/js/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<!-- <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script> -->
<script src="/assets/js/prism-autoloader.min.js"></script>

<script>
    const readmeURL = "{{ cdn }}/README.md";

    const renderer = {
        heading({ text, depth }) {
            const escapedText = text.toLowerCase().replace(/[^\w]+/g, '-');
            return `<h${depth} id="${escapedText}">${text}</h${depth}>`;
        }
    };

    marked.use({
        renderer,
        gfm: true,
        breaks: true
    });

    fetch(readmeURL)
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.text();
        })
        .then(md => {
            const container = document.getElementById("readme-container");

            container.innerHTML = marked.parse(md, {
                highlight: function (code, lang) {
                    if (window.Prism && Prism.languages[lang]) {
                        return Prism.highlight(code, Prism.languages[lang], lang);
                    }
                    return code;
                }
            });

            container.querySelectorAll('img').forEach(img => {
                const link = document.createElement('a');
                link.href = img.src;
                link.className = 'image-item';
                link.target = '_blank';
                img.parentNode.insertBefore(link, img);
                link.appendChild(img);
                img.style.maxHeight = "650px";
            });

            container.querySelectorAll('table').forEach(table => {
                const wrapper = document.createElement('div');
                wrapper.style.overflowX = 'auto';
                wrapper.style.marginBottom = '1rem';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            });

            container.querySelectorAll('p').forEach(p => {
                if (p.querySelectorAll('img').length > 1) {
                    p.classList.add('image-grid');
                }
            });

            if (window.Prism) {
                Prism.highlightAllUnder(container);
            }

            if (window.location.hash) {
                setTimeout(() => {
                    const target = document.querySelector(window.location.hash);
                    if (target) target.scrollIntoView();
                }, 200);
            }
        })
        .catch(err => {
            console.error("Markdown Loader Error:", err);
            document.getElementById("readme-container").innerHTML = "README could not be loaded.";
        });
</script>
