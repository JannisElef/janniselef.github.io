
<div class="image-loader-container">
  <div class="content-wrapper" id="content-wrapper-{{ include.id }}">
    
    <div class="content-header">
      <div class="header-left" style="display: flex; align-items: center; gap: 8px; overflow: hidden;">
        <span class="material-icons">image</span>
        <a class="content-filename" 
          href="https://github.com/{{ page.repo }}/blob/{{ page.branch }}{{ include.file }}" 
          target="_blank" rel="noopener noreferrer"
          style="text-decoration: none; color: inherit;">
          {{ include.file | split: "/" | last }}
        </a>
        {% if include.filesize %}
          <span class="filesize-badge" style="opacity: 0.5; font-size: 0.75rem;">({{ include.filesize }})</span>
        {% endif %}
      </div>
      
      <div class="content-buttons">
        <button id="reset-img-{{ include.id }}" style="display: none;" title="Reset View">
          <span class="material-icons">restart_alt</span>
        </button>

        <button id="load-img-btn-{{ include.id }}">
          <span class="material-icons">visibility</span>
          <span> View</span>
        </button>

        <button id="download-img-btn-{{ include.id }}" title="Download">
          <span class="material-icons">file_download</span>
        </button>

        <a href="{{ cdn }}{{ include.file }}" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
          <button type="button" title="Open in new Tab">
            <span class="material-icons">open_in_new</span>
          </button>
        </a>

        <button id="close-img-{{ include.id }}" style="display: none;" title="Close View">
          <span class="material-icons">close</span>
        </button>
      </div>
    </div>

    <div id="image-viewer-{{ include.id }}" style="display: none; width: 100%; height: 450px; background: var(--container-bg-color); overflow: hidden; cursor: grab; position: relative; touch-action: none;">
        <div id="panzoom-parent-{{ include.id }}" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
            <img id="target-img-{{ include.id }}" src="{{ cdn }}{{ include.file }}" 
                 style="width: 100%; height: 100%; object-fit: contain; display: block; transform-origin: center;">
        </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

<script>
(function() {
  const btn = document.getElementById("load-img-btn-{{ include.id }}");
  const resetBtn = document.getElementById("reset-img-{{ include.id }}");
  const closeBtn = document.getElementById("close-img-{{ include.id }}");
  const container = document.getElementById("image-viewer-{{ include.id }}");
  const imgElement = document.getElementById("target-img-{{ include.id }}");
  const downloadBtn = document.getElementById("download-img-btn-{{ include.id }}");

  let panzoom;

  if (btn && container && imgElement) {
    btn.addEventListener("click", () => {
      btn.style.display = "none";
      resetBtn.style.display = "flex";
      closeBtn.style.display = "flex";
      container.style.display = "block";

      panzoom = Panzoom(imgElement, {
        maxScale: 10,
        minScale: 1,
        step: 0.3,
        contain: 'outside',
        canvas: false
      });

      container.addEventListener('wheel', (event) => {
        event.preventDefault();
        panzoom.zoomWithWheel(event);
      }, { passive: false });

      imgElement.addEventListener('panzoomstart', () => container.style.cursor = 'grabbing');
      imgElement.addEventListener('panzoomend', () => container.style.cursor = 'grab');
    });
  }

  if (closeBtn) {
    closeBtn.addEventListener("click", () => {

      container.style.display = "none";
      resetBtn.style.display = "none";
      closeBtn.style.display = "none";
      btn.style.display = "flex";
      
      if (panzoom) {
        panzoom.destroy();
      }
    });
  }

  if (resetBtn) {
    resetBtn.addEventListener("click", () => {
      if(panzoom) panzoom.reset();
    });
  }

  if (downloadBtn) {
    downloadBtn.addEventListener("click", async () => {
      const imageUrl = "{{ cdn }}{{ include.file }}";
      const fileName = "{{ include.file | split: '/' | last }}";
      try {
        const response = await fetch(imageUrl);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      } catch (error) {
        const a = document.createElement('a');
        a.href = imageUrl; a.download = fileName; a.target = '_blank';
        a.click();
      }
    });
  }
})();
</script>
